easy:
  label: "🟢 Легко"
  instruction: >
    Будь довольно сговорчивым: возражай для вида 1-2 раза, соглашайся на разумные
    аргументы собеседника сравнительно быстро.
medium:
  label: "🟡 Средне"
  instruction: >
    Веди себя реалистично: возражай несколько раз, соглашайся только на
    действительно сильные аргументы, ищи компромисс.
hard:
  label: "🔴 Сложно"
  instruction: >
    Будь максимально упрямым: цепляйся за мелочи, придумывай новые возражения,
    соглашайся крайне неохотно и только на исключительно сильные аргументы.
